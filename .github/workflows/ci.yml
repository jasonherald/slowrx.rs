name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Check & Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build
        run: cargo build --all-features --locked

      # Round-trip integration tests in `tests/roundtrip.rs` decode
      # 200+ seconds of synthetic SSTV audio per mode × 11 modes. In
      # debug mode locally these take ~547 s; on a 2-core GitHub
      # runner they're materially slower (tests routinely log
      # "running over 60 seconds" warnings). In release the same
      # suite is ~11 s — release is also what end-users run, so
      # decode-correctness coverage there is more representative.
      # Release drops `debug_assert!` / overflow-check panics; the
      # `test-debug` job below restores them for the fast suites.
      - name: Test
        run: cargo test --all-features --locked --release

      - name: Doc build
        run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  # Debug-profile tests: overflow checks and `debug_assert!` are on, which
  # the release `Test` step above can't see — that matters for the
  # `#[allow(clippy::cast_*)]` `f64 as usize` index math in the decoder.
  # Only the fast suites run here: the unit tests (lib + binary) and the
  # no-VIS regression. The synthetic round-trips (`--test roundtrip`,
  # ~547 s in debug) and the other decode-heavy integration tests stay
  # release-only.
  test-debug:
    name: Test (debug, fast suites)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2

      - name: Unit tests (debug)
        run: cargo test --lib --bins --all-features --locked

      - name: No-VIS regression (debug)
        run: cargo test --test no_vis --all-features --locked

  msrv:
    name: MSRV check (1.85)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7
        with:
          toolchain: "1.85"
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2
      - name: cargo check on MSRV
        run: cargo check --all-features --locked


  publish-dryrun:
    name: Publish dry-run
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2
      - name: cargo publish --dry-run
        run: cargo publish --dry-run --locked
      - name: cargo package --list (visibility check)
        # Surfaces the exact file list that would be uploaded to crates.io.
        # CI doesn't gate on this — it's diagnostic for reviewers — but
        # any unexpected file (e.g. fixtures, test corpora) should be
        # caught here before we publish.
        run: cargo package --list --locked --allow-dirty
